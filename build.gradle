plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
    id 'maven-publish'
}
version = project.mod_version
group = project.mod_group_id
base { archivesName = project.mod_id }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
sourceSets {
    gametest {
        java.setSrcDirs(['src/gametest/java'])
        resources.setSrcDirs(['src/gametest/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}
loom {
    mods {
        myriad { sourceSet sourceSets.main }
        if (providers.gradleProperty('myriadGameTests').isPresent()) {
            myriad_gametest { sourceSet sourceSets.gametest }
        }
    }
    runs {
        client { client(); runDir 'run-fabric-client'; programArgs '--username', 'MyriadPilot' }
        server { server(); runDir 'run-fabric-server'; programArg '--nogui' }
        observer { client(); runDir 'run-fabric-observer'; programArgs '--username', 'MyriadObserver' }
        gameTestClient {
            client()
            source sourceSets.gametest
            name 'Fabric integrated GameTests'
            runDir 'run-fabric-gametest-client'
            vmArg '-Dmyriad.combatTests=true'
        }
        gameTestServer {
            server()
            name 'Fabric GameTest'
            source sourceSets.gametest
            runDir 'run-fabric-gametest'
            vmArg '-Dfabric-api.gametest=true'
            vmArg '-Dfabric-api.gametest.filter=' + providers.gradleProperty('gameTestFilter').getOrElse('myriad:first_group')
            vmArg '-Dfabric-api.gametest.report-file=' + project.file('build/reports/fabric-gametest.xml').absolutePath
            vmArg '-Dmyriad.combatTests=true'
        }
        arenaFixtureServer {
            server()
            source sourceSets.gametest
            name 'Synthetic arena dedicated restart checks'
            runDir 'run-fabric-arena-fixture'
            programArg '--nogui'
            vmArg '-Dmyriad.arenaFixtureStage=' + providers.gradleProperty('arenaFixtureStage').getOrElse('')
            vmArg '-Dmyriad.arenaFixtureMode=' + providers.gradleProperty('arenaFixtureMode').getOrElse('3v3')
        }
    }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel', '**/.cache/**', 'META-INF/neoforge.mods.toml'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '1000']
}
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    inputs.property 'mod_license', project.mod_license
    filesMatching('fabric.mod.json') { expand version: project.version, mod_license: project.mod_license }
}
tasks.named('jar') { archiveClassifier.set('no-arms') }
tasks.named('processResources') { from('LICENSE') }
tasks.named('sourcesJar') { from('LICENSE') }

tasks.withType(JavaExec).configureEach { standardInput = System.in }

tasks.named('check') { dependsOn tasks.named('compileGametestJava') }

// Build-only tool runs against the same classes and seven packaged role definitions as the release JAR.
sourceSets {
    balanceSnapshot {
        java.setSrcDirs(['tools/balance/java'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

def balanceDirectory = layout.buildDirectory.dir('balance')
def snapshotRevision = providers.exec {
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.map { it.trim() }
def snapshotDirty = providers.exec {
    commandLine 'git', 'status', '--porcelain', '--untracked-files=normal'
}.standardOutput.asText.map { !it.isBlank() }

def exportBalanceSnapshot = tasks.register('exportBalanceSnapshot', JavaExec) {
    group = 'build'
    description = 'Export the current gameplay rules and coverage report.'
    dependsOn tasks.named('balanceSnapshotClasses')
    mainClass = 'com.myriad.game.BalanceSnapshot'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    classpath = sourceSets.balanceSnapshot.runtimeClasspath
    inputs.files(fileTree('maps') { include '**/myriad_monster_spawns.json', '**/myriad_lane_layout.json', '**/myriad_match_tempo.json', '**/myriad_vein_spawns.json' })
        .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property 'sourceRevision', snapshotRevision
    inputs.property 'sourceDirty', snapshotDirty
    outputs.dir balanceDirectory
    argumentProviders.add({
        [projectDir.absolutePath, balanceDirectory.get().asFile.absolutePath,
         snapshotRevision.get(), snapshotDirty.get().toString()]
    } as CommandLineArgumentProvider)
}

tasks.named('jar') {
    dependsOn exportBalanceSnapshot
    from(balanceDirectory.map { it.file('myriad-balance-snapshot.sha256') }) {
        into 'META-INF'
    }
}
