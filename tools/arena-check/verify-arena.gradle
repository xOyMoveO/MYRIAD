gradle.projectsEvaluated {
    def checkOutput = rootProject.layout.buildDirectory.dir('arena-check')
    def compileCheck = rootProject.tasks.register('compileArenaCheck', JavaCompile) {
        dependsOn rootProject.tasks.named('classes')
        source = rootProject.fileTree('tools/arena-check') { include '*.java' }
        classpath = rootProject.sourceSets.main.compileClasspath + rootProject.sourceSets.main.output
        destinationDirectory = checkOutput
        javaCompiler = rootProject.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
    }
    rootProject.tasks.register('verifyArenaModes', JavaExec) {
        dependsOn compileCheck
        // Resolve Minecraft and Fabric from this build; never prepend an installed instance JAR.
        classpath = rootProject.files(checkOutput) + rootProject.sourceSets.main.runtimeClasspath
        mainClass = 'com.myriad.check.ArenaModesCheck'
        javaLauncher = rootProject.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        args rootProject.file(rootProject.findProperty('arenaCheckWorld') ?: 'src/gametest/resources/arena-fixture').absolutePath
        if (rootProject.hasProperty('arenaCheckTerrain')) {
            if (!rootProject.hasProperty('arenaCheckWorld')) throw new GradleException('Terrain comparison requires an explicit -ParenaCheckWorld path')
            args '--terrain'
        }
        jvmArgs '-Xmx1G'
    }
    rootProject.tasks.register('measureBattleTraffic', JavaExec) {
        dependsOn compileCheck
        mainClass = 'com.myriad.check.HudTrafficCheck'
        javaLauncher = rootProject.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        classpath = rootProject.files(checkOutput) + rootProject.sourceSets.main.runtimeClasspath
        def baseline = rootProject.findProperty('trafficBaselineJar')
        if (baseline) {
            def jar = rootProject.file(baseline)
            if (!jar.isFile()) throw new GradleException("Missing protocol 26 baseline JAR: " + jar)
            classpath = rootProject.files(jar) + classpath
            args '--baseline'
        }
    }
}
