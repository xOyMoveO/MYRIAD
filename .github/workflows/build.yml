name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: bash ./gradlew build

      - name: Verify Fabric release JAR and SHA256
        run: python tools/fabric/prepare-ci-release.py

      - name: Isolated Fabric GameTests
        run: python tools/fabric/run-ci-gametests.py

      - name: Upload Fabric release JAR and SHA256
        uses: actions/upload-artifact@v7
        with:
          name: myriad-fabric-26.3-${{ github.sha }}
          path: build/ci-release/*
          if-no-files-found: error

      - name: Upload build and GameTest evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabric-build-evidence-${{ github.sha }}
          path: |
            build/reports/
            run-fabric-gametest/crash-reports/
          if-no-files-found: warn
